# Throwaway multi-tenant Loki for tests/test_live_loki.py (CI job live-loki). Not a
# production config: in-memory ring, filesystem storage under /tmp.
auth_enabled: true
server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn
common:
  instance_addr: 127.0.0.1
  path_prefix: /tmp/loki
  storage:
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
querier:
  multi_tenant_queries_enabled: true
limits_config:
  volume_enabled: true
  allow_structured_metadata: true
schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
# get_patterns' live tests. This one line is the whole addition for a single-binary Loki
# whose common.ring.kvstore is inmemory: the pattern ingester's ring inherits it
# (measured on 3.7.8, 2026-11-11; /config shows store: inmemory, no consul).
pattern_ingester:
  enabled: true
