name: Release

on:
  push:
    tags:
      - "v*"

# Read at the top; write only on the job that creates the release (F6).
permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      # The tag and the package must agree. A v0.2.0 tag on a tree whose pyproject says
      # 0.1.1 is how the deployed metadata came to say 0.1.0 while pyproject said 0.1.1.
      - name: Tag matches package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          pip install dist/*.whl
          ver=$(python -c "import importlib.metadata as m; print(m.version('loki-mcp'))")
          init=$(python -c "import loki_mcp; print(loki_mcp.__version__)")
          echo "tag=${TAG_NAME} metadata=${ver} __version__=${init}"
          test "${TAG_NAME}" = "v${ver}" && test "${ver}" = "${init}"

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      # `gh release create` / `upload` write to the repo's releases.
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download distribution artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG_NAME}" &>/dev/null; then
            gh release upload "${TAG_NAME}" dist/*.whl dist/*.tar.gz --clobber
          else
            gh release create "${TAG_NAME}" \
              dist/*.whl dist/*.tar.gz \
              --title "${TAG_NAME}" \
              --generate-notes \
              --verify-tag
          fi
