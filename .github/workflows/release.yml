name: Release

on:
  push:
    tags:
      - "v*"

# Read at the top; write only on the jobs that need it (F6): contents:write to create and
# annotate the release, packages:write only on the image push.
permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # Hash-locked, transitive dependencies included, and the backend too (--no-isolation
      # uses these instead of resolving setuptools fresh): the release artefacts are what
      # a deploy may install, and everything else here is pinned by SHA or lock (audit
      # F-04, R2-03). Dependabot's pip ecosystem keeps .github/build-requirements.txt current.
      - name: Install build tools
        run: pip install --require-hashes -r .github/build-requirements.txt

      - name: Build sdist and wheel
        run: python -m build --no-isolation

      # The tag and the package must agree. A v0.2.0 tag on a tree whose pyproject says
      # 0.1.1 is how the deployed metadata came to say 0.1.0 while pyproject said 0.1.1.
      - name: Tag matches package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          pip install dist/*.whl
          ver=$(python -c "import importlib.metadata as m; print(m.version('loki-mcp'))")
          init=$(python -c "import loki_mcp; print(loki_mcp.__version__)")
          echo "tag=${TAG_NAME} metadata=${ver} __version__=${init}"
          test "${TAG_NAME}" = "v${ver}" && test "${ver}" = "${init}"

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      # `gh release create` / `upload` write to the repo's releases.
      contents: write

    # No checkout: this job never reads the tree, and a checkout would leave the
    # contents:write token in .git/config for nothing (audit F-04). `gh` takes the repo
    # from GH_REPO instead.
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG_NAME}" &>/dev/null; then
            gh release upload "${TAG_NAME}" dist/*.whl dist/*.tar.gz --clobber
          else
            gh release create "${TAG_NAME}" \
              dist/*.whl dist/*.tar.gz \
              --title "${TAG_NAME}" \
              --generate-notes \
              --verify-tag
          fi

  # The container image p2 deploys (ghcr.io/tadmstr/loki-mcp, public; Ted 2026-11-11).
  # Its own job so packages:write sits only here, and after `build` so a tag that fails
  # the version check publishes nothing.
  publish-image:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read # checkout
      packages: write # push to ghcr.io
    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # arm64 is emulated on the amd64 runner. Every compiled dependency in the lock
      # publishes an aarch64 manylinux wheel, so this is a copy, not a compile. If it turns
      # slow or flaky, drop linux/arm64 rather than carry the flakiness into a release.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        # The released bytes are built inside a packages:write job, so the tooling that
        # builds them is pinned too: buildx by version, BuildKit by digest. The Dockerfile
        # pins its own frontend on its first line.
        with:
          version: v0.38.2
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The released bytes are checked before anything is pushed: build the
      # amd64 image locally, run the same fail-closed checks as ci.yml's image job, and only
      # then push. The amd64 layers of the push come from this build's cache. arm64 is built
      # from the same Dockerfile and lock but is NOT run here (no arm64 runner); the release
      # notes say so.
      - name: Build amd64 for verification
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: loki-mcp:verify
          cache-to: type=gha,mode=max

      - name: Smoke-test the release image
        env:
          SMOKE_TOKEN: release-smoke-0123456789abcdef
        run: |
          set -u
          if docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
              -e LOKI_MCP_PORT=8511 loki-mcp:verify; then
            echo "started without a token"; exit 1
          fi
          docker run -d --name lm --read-only --cap-drop ALL \
            --security-opt no-new-privileges -p 127.0.0.1:8511:8511 \
            -e LOKI_MCP_PORT=8511 -e LOKI_MCP_API_TOKEN="$SMOKE_TOKEN" \
            -e LOKI_URL=http://loki.invalid:3100 loki-mcp:verify
          curl -sS --retry 15 --retry-delay 1 --retry-all-errors -o /dev/null http://127.0.0.1:8511/health
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8511/mcp)" = 401
          test "$(docker inspect -f '{{.Config.User}}' lm)" = "65534:65534"
          docker rm -f lm

      # `:latest` moves only for a stable vX.Y.Z tag. The build job already
      # requires the tag to equal "v" + the package version, so a PEP 440 prerelease such as
      # v0.4.0rc1 gets its own tag and leaves :latest alone. Lowercased owner, hardcoded:
      # GHCR refuses an uppercase path and the owner is `TadMSTR`.
      - name: Image tags
        id: tags
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          {
            echo "list<<EOF"
            echo "ghcr.io/tadmstr/loki-mcp:${TAG_NAME}"
            if [[ "${TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "ghcr.io/tadmstr/loki-mcp:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          cache-from: type=gha
          tags: ${{ steps.tags.outputs.list }}

  # p2 pins tag + digest, and reads the digest from here rather than from whatever
  # `:latest` points at on the day it deploys.
  image-digest-in-release-notes:
    name: Record the image digest in the release
    runs-on: ubuntu-latest
    needs: [create-github-release, publish-image]
    permissions:
      contents: write # gh release edit
    steps:
      - name: Append digest to release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          DIGEST: ${{ needs.publish-image.outputs.digest }}
        run: |
          test -n "${DIGEST}"
          gh release view "${TAG_NAME}" --json body -q .body > notes.md
          {
            echo
            echo "## Container image"
            echo
            echo '```'
            echo "ghcr.io/tadmstr/loki-mcp:${TAG_NAME}@${DIGEST}"
            echo '```'
            echo
            echo "linux/amd64 was run and smoke-tested before the push; linux/arm64 was built"
            echo "from the same Dockerfile and lock but not run."
          } >> notes.md
          gh release edit "${TAG_NAME}" --notes-file notes.md
