name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege at the top level (F6). GitHub's default token is WRITE, and nothing goes
# red when a workflow runs with more than it needs. No job below escalates.
permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        id: py
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # FROM THE LOCK. `--frozen` installs exactly uv.lock and fails rather than re-resolve,
      # so a green run is evidence about the set this project pins, not about whatever a
      # fresh resolve picked today. The ranges in pyproject.toml are checked separately:
      # the audit job's `uv lock --check` fails if the lock no longer satisfies them.
      - name: Install dependencies (locked)
        env:
          UV_PYTHON: ${{ steps.py.outputs.python-path }}
        run: uv sync --frozen --extra dev --extra otel

      - name: Lint (ruff)
        run: uv run --frozen --no-sync ruff check .

      - name: Format check (ruff)
        run: uv run --frozen --no-sync ruff format --check .

      # The floor is in pyproject.toml with its measured number and date (F8).
      - name: Test
        run: uv run --frozen --no-sync pytest --cov=loki_mcp --cov-report=term-missing

  # MULTI-TENANT BEHAVIOUR AGAINST A REAL LOKI.
  #
  # The test job's live tests SKIP (no Loki), and a skip is not a pass. This job is what
  # runs them: grafana/loki 3.7.6 pinned by digest, with auth_enabled and
  # multi_tenant_queries_enabled. It is what proves, on every change, that a header-less
  # call names LOKI_ORG_ID, that `main|fake` reads both tenants with __tenant_id__, that
  # every endpoint loki-mcp calls still accepts a multi-tenant header, and that Loki would
  # serve `main:x` as `main` (the reason the client rejects colons).
  live-loki:
    name: Live multi-tenant Loki
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        id: py
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies (locked)
        env:
          UV_PYTHON: ${{ steps.py.outputs.python-path }}
        run: uv sync --frozen --extra dev

      - name: Start Loki 3.7.6 (multi-tenant)
        run: |
          docker run -d --name loki -p 127.0.0.1:3100:3100 \
            -v "$PWD/tests/loki-live-config.yaml:/etc/loki/config.yaml:ro" \
            grafana/loki:3.7.6@sha256:efd47c67f9bac88ca29bcf8cb997d9ab29d1848bd0aff579282295542a745952 \
            -config.file=/etc/loki/config.yaml
          # /ready answers 503 for ~15 s after start; --retry-all-errors covers that.
          curl -sSf --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:3100/ready

      # -m live selects only the live tests, and `--strict-markers` plus the count check
      # below make sure they RAN: a typo in LOKI_LIVE_URL would otherwise skip all of them
      # and leave this job green.
      - name: Live tests
        env:
          LOKI_LIVE_URL: http://127.0.0.1:3100
        run: |
          uv run --frozen --no-sync pytest -m live --strict-markers -rs -p no:cacheprovider \
            --junitxml=live.xml
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          s = ET.parse("live.xml").getroot().find("testsuite")
          ran = int(s.get("tests")) - int(s.get("skipped"))
          print(f"live tests run: {ran}, skipped: {s.get('skipped')}")
          assert ran >= 15 and s.get("skipped") == "0", "live tests did not all run"
          EOF

      - name: Loki log on failure
        if: failure()
        run: docker logs loki | tail -100

  # DEPENDENCY AUDIT, against the lock.
  #
  # `pip-audit --strict .` on a project without a lock re-resolves the declared ranges
  # and reports on what a fresh install would get today, not on what this project pins
  # (vikunja#633: an audit read undici 7.29.0 green while the deployed tree ran 7.28.0
  # with four HIGH advisories).
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # A committed lock nobody checks is a stale file that looks like a pin. This fails
      # when pyproject.toml changed and uv.lock did not.
      - name: Lockfile is in sync with pyproject.toml
        run: uv lock --check

      # Two gates, because they want different responses: a runtime advisory affects the
      # deployed server, a dev advisory affects only CI. `otel` is on the
      # runtime side: it is off by default but it is what the process loads when enabled.
      # --no-emit-project: --strict trips on the project's own versionless entry.
      - name: Export runtime dependency set
        run: |
          uv export --frozen --no-emit-project \
            --all-extras --no-extra dev \
            --format pylock.toml -o pylock.runtime.toml

      - name: Export dev dependency set
        run: |
          uv export --frozen --no-emit-project \
            --extra dev \
            --format pylock.toml -o pylock.dev.toml

      # Each in its own directory: PEP 751 makes both `pylock.*.toml` names valid, so
      # `pip-audit --locked .` would read and merge both, and lose which side a finding is
      # on. pip-audit itself is pinned: `uv tool run` resolves it fresh otherwise, and an
      # audit tool that floats can turn a gate green.
      # No --ignore-vuln without a dated, ticket-referenced reason next to it.
      - name: Audit runtime dependencies
        run: |
          mkdir -p .audit-runtime && cp pylock.runtime.toml .audit-runtime/pylock.toml
          uv tool run --from "pip-audit==2.10.1" pip-audit --strict --locked .audit-runtime

      - name: Audit dev dependencies
        run: |
          mkdir -p .audit-dev && cp pylock.dev.toml .audit-dev/pylock.toml
          uv tool run --from "pip-audit==2.10.1" pip-audit --strict --locked .audit-dev

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Same pins as release.yml, so CI builds the artefact the release will build.
      - name: Install build tools
        run: pip install "build==1.6.1" "setuptools==84.0.0" "wheel==0.48.0"

      - name: Build sdist and wheel
        run: python -m build --no-isolation

      # The src/ move needs `where = ["src"]`; without it the wheel builds empty and
      # nothing else notices until someone installs it. Both entry points are checked.
      - name: Verify wheel contents
        run: |
          pip install dist/*.whl
          python -c "import loki_mcp, loki_mcp.server; print('import ok', loki_mcp.__version__)"
          command -v loki-mcp

  # Pins move as matched sets (codeql-action's init/analyze/upload-sarif). Dependabot's
  # group stops it splitting them; this stops a hand edit doing it. Stdlib-only, and the
  # checker proves it can fail before it reports the tree clean.
  workflow-pins:
    name: Action pins are consistent
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check action pins
        run: python3 tests/check_action_pins.py
