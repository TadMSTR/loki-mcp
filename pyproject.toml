[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loki-mcp"
version = "0.1.1"
description = "FastMCP server for Loki LogQL queries — read-only access to log streams"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["mcp", "loki", "logql", "observability", "fastmcp"]
dependencies = [
    "fastmcp>=3.2.0,<4.0.0",
    "httpx>=0.27",
    "structlog>=24.0",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pytest-cov>=4.0",
    "ruff",
]

[project.scripts]
loki-mcp = "loki_mcp.server:main"

[tool.setuptools.packages.find]
include = ["loki_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B", "SIM"]

[tool.coverage.report]
fail_under = 80
show_missing = true
